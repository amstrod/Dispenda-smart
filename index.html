<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="manifest" href="./manifest.json" />
  <title>DispensaSmart Famiglia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <header class="bg-green-600 text-white px-4 py-4 shadow sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold">DispensaSmart</h1>
        <p id="sub-fam" class="text-xs text-green-100">Gruppo: CASA-BASE</p>
      </div>
      <button id="b-fam" type="button" class="bg-green-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-green-500">Famiglia</button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <section id="box-fam" class="hidden bg-white p-4 rounded-2xl shadow border border-green-200 space-y-2.5">
      <div class="flex justify-between items-center">
        <span class="font-bold text-sm">Codice Famiglia</span>
        <button id="b-fam-close" type="button" class="text-xs text-slate-500">Chiudi</button>
      </div>
      <div class="flex gap-2">
        <input id="in-fam" type="text" placeholder="ES. CASA-ROSSI" class="flex-1 border rounded-xl px-3 py-2 text-sm uppercase" />
        <button id="b-fam-ok" type="button" class="bg-green-600 text-white text-xs font-bold px-4 py-2 rounded-xl">Salva</button>
      </div>
      <button id="b-fam-share" type="button" class="w-full bg-slate-100 text-slate-700 text-xs font-semibold py-2 rounded-xl">Condividi Link Famiglia</button>
    </section>

    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-3 rounded-xl shadow-sm border"><div id="c-tot" class="text-xl font-bold">0</div><div class="text-xs text-slate-500">Totale</div></div>
      <div class="bg-amber-50 p-3 rounded-xl shadow-sm border border-amber-200"><div id="c-soon" class="text-xl font-bold text-amber-600">0</div><div class="text-xs text-amber-700">In scadenza</div></div>
      <div class="bg-red-50 p-3 rounded-xl shadow-sm border border-red-200"><div id="c-exp" class="text-xl font-bold text-red-600">0</div><div class="text-xs text-red-700">Scaduti</div></div>
    </section>

    <section class="grid grid-cols-2 gap-2">
      <button id="b-cam-bar" type="button" class="bg-green-600 active:bg-green-800 text-white font-semibold py-3 rounded-xl text-sm">📷 Scatta Barcode</button>
      <button id="b-add" type="button" class="bg-white active:bg-slate-200 text-slate-800 font-semibold py-3 rounded-xl border border-slate-300 text-sm">➕ Aggiungi a mano</button>
    </section>

    <input id="file-bar" type="file" accept="image/*" capture="environment" class="hidden" />
    <div id="reader-hidden" class="hidden"></div>
    <canvas id="strip-canvas" class="hidden"></canvas>

    <div id="scan-status" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs px-3.5 py-2.5 rounded-xl font-medium"></div>

    <section id="live-exp-box" class="hidden bg-slate-900 text-white p-3 rounded-2xl shadow space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold">Allinea la data nella fascia</span>
        <button id="b-live-close" type="button" class="text-xs bg-slate-700 px-2.5 py-1 rounded-lg">Chiudi</button>
      </div>
      <div id="live-frame" class="relative w-full h-40 bg-black rounded-xl overflow-hidden">
        <video id="live-video" playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>
        <div class="pointer-events-none absolute inset-x-0 top-0 h-[36%] bg-black/55"></div>
        <div class="pointer-events-none absolute inset-x-0 bottom-0 h-[36%] bg-black/55"></div>
        <div class="pointer-events-none absolute left-0 top-[36%] w-[6%] h-[28%] bg-black/55"></div>
        <div class="pointer-events-none absolute right-0 top-[36%] w-[6%] h-[28%] bg-black/55"></div>
        <div class="pointer-events-none absolute left-[6%] top-[36%] w-[88%] h-[28%] border-2 border-amber-400 rounded-md"></div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <span id="live-ocr-msg" class="text-[11px] text-amber-200 truncate">Ricerca automatica attiva...</span>
        <button id="b-live-now" type="button" class="bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg shrink-0">Leggi ora</button>
      </div>
    </section>

    <section class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-2">
      <span class="text-xs"><b id="c-sel">0</b> selezionati</span>
      <button id="b-rec" type="button" class="bg-amber-500 active:bg-amber-600 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl">🍳 Proponi Ricette</button>
    </section>

    <section id="box-rec" class="hidden bg-white p-4 rounded-2xl shadow border border-amber-300 space-y-2">
      <div class="flex justify-between items-center"><span class="font-bold text-sm">Ricette / Idee suggerite</span><button id="b-rec-close" type="button" class="text-xs text-slate-500">Chiudi</button></div>
      <div id="rec-list" class="space-y-2 text-xs"></div>
    </section>

    <section id="box-form" class="hidden bg-white p-4 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center"><span class="font-bold text-sm">Dettagli prodotto</span><button id="b-cancel" type="button" class="text-xs text-slate-500">Annulla</button></div>
      <div id="ocr-info" class="hidden text-xs bg-emerald-50 text-emerald-900 border border-emerald-200 px-3 py-2 rounded-xl"></div>
      <div class="grid grid-cols-2 gap-2">
        <button id="b-form-bar" type="button" class="bg-emerald-50 active:bg-emerald-100 text-emerald-900 border border-emerald-300 font-semibold py-2 rounded-xl text-xs">📷 Scatta Barcode</button>
        <button id="b-cam-exp" type="button" class="bg-amber-50 active:bg-amber-100 text-amber-950 border border-amber-300 font-semibold py-2 rounded-xl text-xs">📅 Auto-Scadenza</button>
      </div>
      <input id="in-name" type="text" placeholder="Nome prodotto" class="w-full border rounded-xl px-3 py-2 text-sm" />
      <div class="grid grid-cols-2 gap-2">
        <select id="in-loc" class="border rounded-xl px-3 py-2 text-sm bg-white">
          <option value="Frigo">Frigo</option>
          <option value="Dispensa">Dispensa</option>
          <option value="Freezer">Freezer</option>
        </select>
        <input id="in-qty" type="number" min="1" value="1" class="border rounded-xl px-3 py-2 text-sm" />
      </div>
      <input id="in-exp" type="date" class="w-full border rounded-xl px-3 py-2 text-sm" />
      <button id="b-save" type="button" class="w-full bg-green-600 active:bg-green-700 text-white font-bold py-2.5 rounded-xl text-sm">Salva prodotto</button>
    </section>

    <section id="list" class="space-y-2"></section>
  </main>

  <script>
    (function () {
      var fam = "CASA-BASE";
      try {
        var q = new URLSearchParams(window.location.search).get("family");
        fam = (q || localStorage.getItem("ds_fam") || "CASA-BASE").toUpperCase();
        localStorage.setItem("ds_fam", fam);
      } catch (e) {}
      var items = [], sel = [], lastBarcode = "", lastExpiryNote = "";
      var liveStream = null, liveTimer = null, ocrBusy = false;

      var RICETTE = [
        { t: "Colazione o merenda dolce", dolce: true, ing: ["biscott", "gemma", "cocco", "yogurt", "latte", "banana", "mela", "cioccolat", "miele", "cereali", "fette biscottate"], d: "Ottimo per colazione o merenda: gustalo da solo, con yogurt, latte o frutta fresca." },
        { t: "Frittata svuota-frigo", dolce: false, ing: ["uova", "formaggio", "patate", "zucchine", "cipolla", "prosciutto", "spinaci"], d: "Sbatti le uova, unisci gli ingredienti salati a pezzetti e cuoci in padella." },
        { t: "Pasta veloce", dolce: false, ing: ["pasta", "pomodoro", "passata", "tonno", "olive", "panna", "formaggio"], d: "Cuoci la pasta e condiscila con sugo, tonno, verdure o formaggio." },
        { t: "Insalatona / Piatto freddo", dolce: false, ing: ["lattuga", "insalata", "pomodoro", "tonno", "mais", "mozzarella", "uova"], d: "Unisci verdure e proteine con olio e sale." },
        { t: "Riso o zuppa salata", dolce: false, ing: ["riso", "zucchine", "zucca", "carote", "patate", "ceci", "fagioli"], d: "Cuoci insieme gli ingredienti salati in pentola o padella." }
      ];
      function key() { return "ds_items_" + fam; }
      function load() { try { var r = localStorage.getItem(key()); items = r ? JSON.parse(r) : []; } catch (e) { items = []; } }
      function save() { try { localStorage.setItem(key(), JSON.stringify(items)); } catch (e) {} render(); }
      function daysLeft(s) { var t = new Date(); t.setHours(0, 0, 0, 0); var e = new Date(s + "T00:00:00"); return Math.round((e - t) / 86400000); }
      function defaultExp(days) { var d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().split("T")[0]; }
      function setStatus(msg) { var el = document.getElementById("scan-status"); el.textContent = msg; el.classList.remove("hidden"); }
      function hideStatus() { document.getElementById("scan-status").classList.add("hidden"); }
      function updateFormInfo() {
        var info = document.getElementById("ocr-info");
        var parts = [];
        if (lastBarcode) parts.push("Barcode: " + lastBarcode);
        if (lastExpiryNote) parts.push(lastExpiryNote);
        if (!parts.length) { info.classList.add("hidden"); return; }
        info.textContent = parts.join(" • ");
        info.classList.remove("hidden");
      }
      function applyGrayContrast(canvas, contrastFactor) {
        var ctx = canvas.getContext("2d");
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var d = imgData.data;
        for (var i = 0; i < d.length; i += 4) {
          var gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          var adj = (gray - 128) * contrastFactor + 128;
          if (adj < 0) adj = 0;
          if (adj > 255) adj = 255;
          d[i] = adj; d[i + 1] = adj; d[i + 2] = adj;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      function validIso(y, m, d) {
        if (m < 1 || m > 12 || d < 1 || d > 31) return null;
        if (y < 100) y += 2000;
        if (y < 2020 || y > 2045) return null;
        var dt = new Date(y, m - 1, d);
        if (dt.getFullYear() !== y || dt.getMonth() !== (m - 1) || dt.getDate() !== d) return null;
        return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      }

      function parseExpiryDate(txt) {
        var c = (txt || "").replace(/(?:^|\s)[A-Z](?=\s|$)/g, " ").replace(/[oOQ]/g, "0").replace(/[lI|!]/g, "1").replace(/[sS]/g, "5");
        var m = c.match(/\b([0-3]?\d)\s*[\/\-. ]\s*([01]?\d)\s*[\/\-. ]\s*(20\d{2}|\d{2})\b/);
        if (m) { var iso1 = validIso(parseInt(m[3], 10), parseInt(m[2], 10), parseInt(m[1], 10)); if (iso1) return iso1; }
        m = c.match(/\b(20\d{2}|\d{2})\s*[\/\-. ]\s*([01]?\d)\s*[\/\-. ]\s*([0-3]?\d)\b/);
        if (m) { var iso2 = validIso(parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)); if (iso2) return iso2; }
        m = c.match(/\b([01]?\d)\s*[\/\-.]\s*(20\d{2})\b/);
        if (m) {
          var mm = parseInt(m[1], 10), yy = parseInt(m[2], 10);
          if (mm >= 1 && mm <= 12) { var last = new Date(yy, mm, 0).getDate(); return yy + "-" + String(mm).padStart(2, "0") + "-" + String(last).padStart(2, "0"); }
        }
        return null;
      }

      function scanBarcodeFile(file) {
        if (typeof Html5Qrcode === "undefined") return Promise.resolve("");
        try {
          var scanner = new Html5Qrcode("reader-hidden");
          return scanner.scanFile(file, false).then(function (code) {
            try { scanner.clear(); } catch (e) {}
            return code || "";
          }).catch(function () {
            try { scanner.clear(); } catch (e) {}
            return "";
          });
        } catch (e) { return Promise.resolve(""); }
      }

      function lookupProductName(code) {
        if (!code) return Promise.resolve("");
        return fetch("https://world.openfoodfacts.org/api/v0/product/" + encodeURIComponent(code) + ".json")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.status === 1 && data.product) {
              var n = data.product.product_name_it || data.product.product_name || "";
              var b = data.product.brands ? " (" + data.product.brands + ")" : "";
              return (n + b).trim() || ("Prodotto " + code);
            }
            return "Barcode " + code;
          }).catch(function () { return "Barcode " + code; });
      }

      function stopLiveExpiry() {
        if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
        if (liveStream) {
          liveStream.getTracks().forEach(function (tr) { tr.stop(); });
          liveStream = null;
        }
        ocrBusy = false;
        document.getElementById("live-exp-box").classList.add("hidden");
      }

      function captureStripCanvas() {
        var video = document.getElementById("live-video");
        if (!video || !video.videoWidth || !video.videoHeight) return null;
        var vw = video.videoWidth, vh = video.videoHeight;
        var sx = Math.round(vw * 0.06);
        var sy = Math.round(vh * 0.36);
        var sw = Math.round(vw * 0.88);
        var sh = Math.max(24, Math.round(vh * 0.28));

        var c = document.getElementById("strip-canvas");
        var scale = sw > 950 ? (950 / sw) : 1;
        c.width = Math.max(1, Math.round(sw * scale));
        c.height = Math.max(1, Math.round(sh * scale));
        c.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
        applyGrayContrast(c, 1.9);
        return c;
      }

      function runLiveFrameOcr(manual) {
        if (ocrBusy || typeof Tesseract === "undefined") return;
        var canvas = captureStripCanvas();
        if (!canvas) return;
        ocrBusy = true;
        document.getElementById("live-ocr-msg").textContent = manual ? "Lettura fascia in corso..." : "Scansione automatica...";

        Tesseract.recognize(canvas, "eng", { logger: function () {} }).then(function (res) {
          ocrBusy = false;
          var raw = (res && res.data && res.data.text) ? res.data.text : "";
          var found = parseExpiryDate(raw);
          if (found) {
            document.getElementById("in-exp").value = found;
            lastExpiryNote = "Data riconosciuta in automatico: " + found;
            updateFormInfo();
            stopLiveExpiry();
            document.getElementById("box-form").classList.remove("hidden");
          } else {
            document.getElementById("live-ocr-msg").textContent = "Data non ancora chiara: allinea la riga e riprovo...";
          }
        }).catch(function () {
          ocrBusy = false;
          document.getElementById("live-ocr-msg").textContent = "Riprovo lettura automatica...";
        });
      }

      function startLiveExpiry() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("La fotocamera live non è supportata in questo browser.");
          return;
        }
        stopLiveExpiry();
        document.getElementById("live-exp-box").classList.remove("hidden");
        document.getElementById("live-ocr-msg").textContent = "Avvio fotocamera sulla fascia...";

        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        }).then(function (stream) {
          liveStream = stream;
          var video = document.getElementById("live-video");
          video.srcObject = stream;
          video.onloadedmetadata = function () {
            video.play().catch(function () {});
          };
          document.getElementById("live-ocr-msg").textContent = "Allinea la data nella striscia: lettura automatica...";
          liveTimer = setInterval(function () { runLiveFrameOcr(false); }, 1600);
        }).catch(function () {
          stopLiveExpiry();
          alert("Impossibile accedere alla fotocamera live. Controlla i permessi del browser.");
        });
      }

      function render() {
        document.getElementById("sub-fam").textContent = "Gruppo: " + fam;
        document.getElementById("c-tot").textContent = items.length;
        document.getElementById("c-sel").textContent = sel.length;
        var soon = 0, exp = 0;
        for (var i = 0; i < items.length; i++) { var dl = daysLeft(items[i].expiry); if (dl < 0) exp++; else if (dl <= 3) soon++; }
        document.getElementById("c-soon").textContent = soon;
        document.getElementById("c-exp").textContent = exp;
        var box = document.getElementById("list");
        if (!items.length) {
          box.innerHTML = '<div class="text-center py-8 bg-white rounded-2xl border border-dashed text-slate-400 text-sm">Nessun prodotto. Tocca <b>Scatta Barcode</b> o <b>Aggiungi a mano</b>.</div>';
          return;
        }
        box.innerHTML = items.map(function (it) {
          var chk = sel.indexOf(it.id) >= 0 ? "checked" : "";
          return '<div class="bg-white p-3 rounded-xl border flex items-center justify-between gap-2"><div class="flex items-center gap-2.5 min-w-0"><input type="checkbox" ' + chk + ' data-id="' + it.id + '" class="chk-it w-4 h-4" /><div class="min-w-0"><div class="font-semibold text-sm truncate">' + it.name + '</div><div class="text-xs text-slate-500">' + it.loc + ' • Q.tà ' + it.qty + ' • Scad. ' + it.expiry + '</div></div></div><button type="button" data-id="' + it.id + '" class="del-it bg-slate-100 text-xs px-2.5 py-1.5 rounded-lg">Usato</button></div>';
        }).join("");
        var chks = box.querySelectorAll(".chk-it");
        for (var c = 0; c < chks.length; c++) chks[c].addEventListener("change", function () { var id = this.getAttribute("data-id"), idx = sel.indexOf(id); if (idx >= 0) sel.splice(idx, 1); else sel.push(id); document.getElementById("c-sel").textContent = sel.length; });
        var dels = box.querySelectorAll(".del-it");
        for (var d = 0; d < dels.length; d++) dels[d].addEventListener("click", function () { var id = this.getAttribute("data-id"); items = items.filter(function (x) { return x.id !== id; }); sel = sel.filter(function (x) { return x !== id; }); save(); });
      }

      document.getElementById("b-add").addEventListener("click", function () {
        stopLiveExpiry();
        hideStatus();
        lastBarcode = "";
        lastExpiryNote = "";
        updateFormInfo();
        document.getElementById("in-name").value = "";
        document.getElementById("in-qty").value = "1";
        document.getElementById("in-exp").value = defaultExp(7);
        document.getElementById("box-form").classList.remove("hidden");
      });

      function triggerBarcodePhoto() {
        stopLiveExpiry();
        document.getElementById("file-bar").value = "";
        document.getElementById("file-bar").click();
      }

      document.getElementById("b-cam-bar").addEventListener("click", triggerBarcodePhoto);
      document.getElementById("b-form-bar").addEventListener("click", triggerBarcodePhoto);
      document.getElementById("b-cam-exp").addEventListener("click", function () {
        if (!document.getElementById("in-qty").value) document.getElementById("in-qty").value = "1";
        if (!document.getElementById("in-exp").value) document.getElementById("in-exp").value = defaultExp(7);
        startLiveExpiry();
      });
      document.getElementById("b-live-close").addEventListener("click", stopLiveExpiry);
      document.getElementById("b-live-now").addEventListener("click", function () { runLiveFrameOcr(true); });

      document.getElementById("file-bar").addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (!file) return;
        var formOpen = !document.getElementById("box-form").classList.contains("hidden");
        setStatus("Lettura codice a barre in corso...");
        scanBarcodeFile(file).then(function (code) {
          lastBarcode = code || "";
          if (!code) {
            hideStatus();
            if (!formOpen) {
              lastExpiryNote = "Barcode non trovato: scrivi il nome o usa Auto-Scadenza";
              document.getElementById("in-name").value = "";
              document.getElementById("in-qty").value = "1";
              document.getElementById("in-exp").value = defaultExp(7);
              updateFormInfo();
              document.getElementById("box-form").classList.remove("hidden");
            } else {
              lastExpiryNote = "Barcode non trovato nella foto";
              updateFormInfo();
            }
            return;
          }
          lookupProductName(code).then(function (prodName) {
            hideStatus();
            if (prodName) document.getElementById("in-name").value = prodName;
            if (!formOpen) {
              document.getElementById("in-qty").value = "1";
              if (!document.getElementById("in-exp").value) document.getElementById("in-exp").value = defaultExp(7);
            }
            updateFormInfo();
            document.getElementById("box-form").classList.remove("hidden");
          });
        });
      });

      document.getElementById("b-cancel").addEventListener("click", function () {
        stopLiveExpiry();
        document.getElementById("box-form").classList.add("hidden");
      });
      document.getElementById("b-save").addEventListener("click", function () {
        var name = (document.getElementById("in-name").value || "").trim();
        var loc = document.getElementById("in-loc").value;
        var qty = parseInt(document.getElementById("in-qty").value, 10) || 1;
        var expiry = document.getElementById("in-exp").value || defaultExp(7);
        if (!name) { alert("Scrivi o conferma il nome del prodotto."); return; }
        items.push({ id: String(Date.now()), name: name, loc: loc, qty: qty, expiry: expiry });
        stopLiveExpiry();
        document.getElementById("box-form").classList.add("hidden");
        save();
      });

      document.getElementById("b-rec").addEventListener("click", function () {
        var chosen = items.filter(function (x) { return sel.indexOf(x.id) >= 0; });
        if (!chosen.length) { alert("Seleziona prima almeno un prodotto dalla lista."); return; }
        var joinedNames = chosen.map(function (x) { return x.name.toLowerCase(); }).join(" ");
        var isSweetSnack = /\b(biscott|gemma|cocco|cioccolat|miele|cereali|snack|dolce|wafer|brioche|croissant)\b/.test(joinedNames);

        var found = RICETTE.filter(function (r) {
          if (isSweetSnack && !r.dolce) return false;
          if (!isSweetSnack && r.dolce) return false;
          return r.ing.some(function (k) { return joinedNames.indexOf(k) >= 0; });
        });

        var recBox = document.getElementById("box-rec"), recList = document.getElementById("rec-list");
        recBox.classList.remove("hidden");
        if (!found.length) {
          recList.innerHTML = '<div class="p-2.5 bg-amber-50 rounded-xl">Con <b>' + chosen.map(function (x) { return x.name; }).join(", ") + '</b>: ' + (isSweetSnack ? 'ideale per una merenda o colazione veloce.' : 'puoi usarlo come base per un piatto unico o contorno.') + '</div>';
          return;
        }
        recList.innerHTML = found.map(function (r) { return '<div class="p-2.5 bg-slate-50 rounded-xl border"><div class="font-bold">' + r.t + '</div><div class="text-slate-600 mt-0.5">' + r.d + '</div></div>'; }).join("");
      });

      document.getElementById("b-rec-close").addEventListener("click", function () { document.getElementById("box-rec").classList.add("hidden"); });
      document.getElementById("b-fam").addEventListener("click", function () { document.getElementById("in-fam").value = fam; document.getElementById("box-fam").classList.toggle("hidden"); });
      document.getElementById("b-fam-close").addEventListener("click", function () { document.getElementById("box-fam").classList.add("hidden"); });
      document.getElementById("b-fam-ok").addEventListener("click", function () {
        var v = (document.getElementById("in-fam").value || "").trim().toUpperCase();
        if (!v) return;
        fam = v; try { localStorage.setItem("ds_fam", fam); } catch (e) {}
        sel = []; load(); render(); document.getElementById("box-fam").classList.add("hidden");
      });
      document.getElementById("b-fam-share").addEventListener("click", function () {
        var u = window.location.origin + window.location.pathname + "?family=" + encodeURIComponent(fam);
        if (navigator.share) navigator.share({ title: "DispensaSmart", url: u }).catch(function () {});
        else alert("Link famiglia: " + u);
      });

      if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(function () {}); }
      load();
      render();
    })();
  </script>
</body>
</html>
