<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>DispensaSmart - Zero Sprechi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.75rem; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- Header -->
  <header class="bg-green-600 text-white px-4 py-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight">DispensaSmart</h1>
        <p class="text-xs text-green-100">Scansiona, controlla, zero sprechi</p>
      </div>
      <div id="alert-badge" class="hidden bg-amber-400 text-slate-900 text-xs font-bold px-2.5 py-1 rounded-full">
        0 in scadenza
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Riepilogo rapido -->
    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
        <div id="count-total" class="text-xl font-bold text-slate-800">0</div>
        <div class="text-xs text-slate-500">Totale</div>
      </div>
      <div class="bg-amber-50 p-3 rounded-xl shadow-sm border border-amber-200">
        <div id="count-soon" class="text-xl font-bold text-amber-600">0</div>
        <div class="text-xs text-amber-700">In scadenza</div>
      </div>
      <div class="bg-red-50 p-3 rounded-xl shadow-sm border border-red-200">
        <div id="count-expired" class="text-xl font-bold text-red-600">0</div>
        <div class="text-xs text-red-700">Scaduti</div>
      </div>
    </section>

    <!-- Pulsanti azione principali -->
    <section class="grid grid-cols-2 gap-2">
      <button onclick="openScanner()" class="bg-green-600 active:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2">
        <span>📷</span> Scansiona Barcode
      </button>
      <button onclick="openManualForm()" class="bg-white active:bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-center gap-2">
        <span>➕</span> Aggiungi a mano
      </button>
    </section>

    <!-- Area Scanner Fotocamera -->
    <section id="scanner-box" class="hidden bg-white p-4 rounded-2xl shadow-md border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm text-slate-700">Inquadra il codice a barre</h2>
        <button onclick="closeScanner()" class="text-xs bg-slate-200 px-2.5 py-1 rounded-lg font-medium">Chiudi</button>
      </div>
      <div id="reader" class="w-full overflow-hidden rounded-xl bg-black min-h-[220px]"></div>
      <p id="scanner-status" class="text-xs text-center text-slate-500">Avvio fotocamera in corso...</p>
    </section>

    <!-- Form Aggiunta / Conferma Prodotto -->
    <section id="form-box" class="hidden bg-white p-4 rounded-2xl shadow-md border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-base text-slate-800">Dettagli Prodotto</h2>
        <button onclick="closeForm()" class="text-xs text-slate-500 hover:text-slate-800">Annulla</button>
      </div>

      <div id="product-preview" class="hidden flex items-center gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
        <img id="preview-img" src="" alt="" class="w-12 h-12 object-contain rounded bg-white border" />
        <div class="text-xs">
          <div class="font-semibold text-green-700">Prodotto trovato!</div>
          <div id="preview-barcode" class="text-slate-500"></div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Nome prodotto *</label>
        <input id="inp-name" type="text" placeholder="Es. Latte intero, Yogurt, Pasta..." class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-green-600" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Dove lo metti?</label>
          <select id="inp-location" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm bg-white">
            <option value="Frigo">❄️ Frigo</option>
            <option value="Dispensa">🗄️ Dispensa</option>
            <option value="Freezer">🧊 Freezer</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Quantità</label>
          <input id="inp-qty" type="number" min="1" value="1" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Data di scadenza *</label>
        <input id="inp-expiry" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm" />
        <div class="flex gap-1.5 mt-2 flex-wrap">
          <button type="button" onclick="setQuickDays(3)" class="text-xs bg-slate-100 active:bg-slate-200 px-2.5 py-1.5 rounded-lg font-medium">+3 gg</button>
          <button type="button" onclick="setQuickDays(7)" class="text-xs bg-slate-100 active:bg-slate-200 px-2.5 py-1.5 rounded-lg font-medium">+7 gg</button>
          <button type="button" onclick="setQuickDays(15)" class="text-xs bg-slate-100 active:bg-slate-200 px-2.5 py-1.5 rounded-lg font-medium">+15 gg</button>
          <button type="button" onclick="setQuickDays(30)" class="text-xs bg-slate-100 active:bg-slate-200 px-2.5 py-1.5 rounded-lg font-medium">+1 mese</button>
        </div>
      </div>

      <button onclick="saveProduct()" class="w-full bg-green-600 active:bg-green-700 text-white font-bold py-3 rounded-xl shadow-sm">
        Salva in dispensa
      </button>
    </section>

    <!-- Filtri -->
    <section class="flex gap-2 overflow-x-auto pb-1">
      <button onclick="setFilter('Tutti')" data-filter="Tutti" class="filter-btn bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full">Tutti</button>
      <button onclick="setFilter('Frigo')" data-filter="Frigo" class="filter-btn bg-white text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full">❄️ Frigo</button>
      <button onclick="setFilter('Dispensa')" data-filter="Dispensa" class="filter-btn bg-white text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full">🗄️ Dispensa</button>
      <button onclick="setFilter('Freezer')" data-filter="Freezer" class="filter-btn bg-white text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full">🧊 Freezer</button>
    </section>

    <!-- Lista prodotti -->
    <section id="items-list" class="space-y-2.5"></section>

  </main>

  <script>
    let pantry = JSON.parse(localStorage.getItem('dispensa_smart_v1') || '[]');
    let currentFilter = 'Tutti';
    let html5QrCode = null;
    let currentImage = '';
    let currentBarcode = '';

    function saveStorage() {
      localStorage.setItem('dispensa_smart_v1', JSON.stringify(pantry));
      render();
    }

    function getDaysLeft(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const exp = new Date(dateStr + 'T00:00:00');
      return Math.round((exp - today) / (1000 * 60 * 60 * 24));
    }

    function setQuickDays(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      document.getElementById('inp-expiry').value = d.toISOString().split('T')[0];
    }

    function openManualForm() {
      closeScanner();
      currentImage = '';
      currentBarcode = '';
      document.getElementById('product-preview').classList.add('hidden');
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-qty').value = 1;
      setQuickDays(7);
      document.getElementById('form-box').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('form-box').classList.add('hidden');
    }

    async function openScanner() {
      closeForm();
      const box = document.getElementById('scanner-box');
      const status = document.getElementById('scanner-status');
      box.classList.remove('hidden');
      status.textContent = 'Avvio fotocamera in corso...';

      try {
        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 140 } },
          async (decodedText) => {
            status.textContent = `Codice letto: ${decodedText}. Ricerca prodotto...`;
            await closeScanner();
            await lookupBarcode(decodedText);
          }
        );
        status.textContent = 'Punta il codice a barre dentro il riquadro';
      } catch (err) {
        status.textContent = 'Impossibile aprire la fotocamera (serve HTTPS). Usa "Aggiungi a mano".';
      }
    }

    async function closeScanner() {
      const box = document.getElementById('scanner-box');
      box.classList.add('hidden');
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
        html5QrCode = null;
      }
    }

    async function lookupBarcode(code) {
      openManualForm();
      currentBarcode = code;
      document.getElementById('inp-name').value = 'Ricerca in corso...';

      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
        const data = await res.json();
        if (data.status === 1 && data.product) {
          const name = data.product.product_name_it || data.product.product_name || '';
          const brand = data.product.brands ? ` (${data.product.brands})` : '';
          document.getElementById('inp-name').value = (name + brand).trim() || `Prodotto ${code}`;
          if (data.product.image_front_small_url) {
            currentImage = data.product.image_front_small_url;
            document.getElementById('preview-img').src = currentImage;
            document.getElementById('preview-barcode').textContent = `Barcode: ${code}`;
            document.getElementById('product-preview').classList.remove('hidden');
          }
        } else {
          document.getElementById('inp-name').value = '';
          document.getElementById('inp-name').placeholder = `Codice ${code} non trovato, scrivi il nome`;
        }
      } catch (e) {
        document.getElementById('inp-name').value = '';
      }
    }

    function saveProduct() {
      const name = document.getElementById('inp-name').value.trim();
      const location = document.getElementById('inp-location').value;
      const qty = parseInt(document.getElementById('inp-qty').value, 10) || 1;
      const expiry = document.getElementById('inp-expiry').value;

      if (!name || !expiry) {
        alert('Inserisci almeno il nome del prodotto e la scadenza.');
        return;
      }

      pantry.push({
        id: Date.now().toString(),
        name,
        location,
        qty,
        expiry,
        image: currentImage,
        barcode: currentBarcode
      });

      closeForm();
      saveStorage();
    }

    function removeProduct(id) {
      pantry = pantry.filter(item => item.id !== id);
      saveStorage();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-btn bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full';
        } else {
          btn.className = 'filter-btn bg-white text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full';
        }
      });
      render();
    }

    function render() {
      const list = document.getElementById('items-list');
      let expiredCount = 0;
      let soonCount = 0;

      pantry.forEach(item => {
        const d = getDaysLeft(item.expiry);
        if (d < 0) expiredCount++;
        else if (d <= 3) soonCount++;
      });

      document.getElementById('count-total').textContent = pantry.length;
      document.getElementById('count-soon').textContent = soonCount;
      document.getElementById('count-expired').textContent = expiredCount;

      const badge = document.getElementById('alert-badge');
      const urgent = expiredCount + soonCount;
      if (urgent > 0) {
        badge.textContent = `${urgent} alert`;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const filtered = pantry
        .filter(item => currentFilter === 'Tutti' || item.location === currentFilter)
        .sort((a, b) => new Date(a.expiry) - new Date(b.expiry));

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400 text-sm">
            Nessun prodotto qui.<br/>Tocca <b>Scansiona Barcode</b> per iniziare!
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const days = getDaysLeft(item.expiry);
        let statusClass = 'bg-green-100 text-green-800';
        let statusText = `Tra ${days} gg`;
        let borderClass = 'border-slate-100';

        if (days < 0) {
          statusClass = 'bg-red-100 text-red-800';
          statusText = `Scaduto da ${Math.abs(days)} gg`;
          borderClass = 'border-red-300';
        } else if (days === 0) {
          statusClass = 'bg-red-100 text-red-800';
          statusText = 'Scade OGGI';
          borderClass = 'border-red-300';
        } else if (days <= 3) {
          statusClass = 'bg-amber-100 text-amber-800';
          statusText = days === 1 ? 'Scade domani' : `Tra ${days} gg`;
          borderClass = 'border-amber-300';
        }

        const thumb = item.image
          ? `<img src="${item.image}" class="w-11 h-11 rounded-lg object-contain bg-slate-50 border border-slate-100 shrink-0" />`
          : `<div class="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center text-lg shrink-0">🥫</div>`;

        return `
          <div class="bg-white p-3 rounded-xl shadow-sm border ${borderClass} flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              ${thumb}
              <div class="min-w-0">
                <div class="font-semibold text-sm text-slate-800 truncate">${item.name}</div>
                <div class="text-xs text-slate-500 mt-0.5">
                  ${item.location} • Q.tà: ${item.qty} • Scad: ${item.expiry.split('-').reverse().join('/')}
                </div>
                <span class="inline-block mt-1 text-[11px] font-bold px-2 py-0.5 rounded-full ${statusClass}">
                  ${statusText}
                </span>
              </div>
            </div>
            <button onclick="removeProduct('${item.id}')" title="Consumato" class="bg-slate-100 active:bg-green-600 active:text-white text-slate-600 text-xs font-semibold px-3 py-2 rounded-lg shrink-0">
              ✓ Usato
            </button>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
  </html>
